version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notifierx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifierx_user
      POSTGRES_PASSWORD: notifierx_password
      POSTGRES_DB: notifierx_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notifierx_user -d notifierx_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notifierx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
