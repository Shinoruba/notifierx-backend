server:
  port: 8080

spring:
  application:
    name: notifierx

  datasource:
    url: jdbc:postgresql://localhost:5433/notifierx_db
    username: notifierx_user
    password: notifierx_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

logging:
  level:
    root: INFO
    com.project.notifierx: DEBUG